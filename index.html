
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birthday Surprise ❤️</title>
<style>
body {
  background: linear-gradient(135deg,#230d29,#a83270);
  color: white;
  text-align: center;
  font-family: Georgia;
  padding: 25px 10px;
}
h1 { color: pink; }
input,button {
  padding: 14px;
  border: none;
  border-radius: 25px;
  margin: 10px;
}
button {
  background: #ff69a8;
  color: white;
  font-size: 16px;
}
#surprise { display:none; }
.photos {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.photos img {
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:15px;
}
</style>
</head>
<body>

<div id="lock">
<h1>💗 A Special Surprise 💗</h1>
<p>Someone has a surprise for you!</p>
<h3>Enter Secret Code 🔐</h3>
<input id="code" type="password" placeholder="Secret Code">
<br>
<button onclick="unlock()">Open Surprise ❤️</button>
<br>
<button onclick="hint()">Show Hint 💡</button>
<p id="clue" style="display:none">
Your special hint is waiting here!
</p>
<p id="error"></p>
</div>

<div id="surprise">
<h1>🎂 Happy Birthday! 🎂</h1>
<h2>Dear Cutieee ❤️</h2>
<p>You are very special. May your life always be full of happiness and love! 💗</p>

<h2>Beautiful Memories 📸</h2>
<div class="photos">
<img src="summul-1.jpg">
<img src="summul-2.jpg">
<img src="summul-3.jpg">
</div>

<h2>Made With Love ❤️</h2>
<p>Keep Smiling Always! 🌸</p>
</div>

<script>
function unlock() {
if(document.getElementById("code").value==="1234") {
document.getElementById("lock").style.display="none";
document.getElementById("surprise").style.display="block";
} else {
document.getElementById("error").innerText="Wrong Code! Try Again ❤️";
}
}
function hint() {
document.getElementById("clue").style.display="block";
}
</script>

</body>
</html>
